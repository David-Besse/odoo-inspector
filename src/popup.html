<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --primary-color: #7c59a1;
      --text-color: #333;
      --border-color: #e4e6eb;
      --animation-duration: 0.2s;
    }

    @keyframes quickFadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes quickScaleIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes instantAppear {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideFromLeft {
      0%   { opacity: 0; transform: translateX(-20px); }
      80%  { opacity: 1; transform: translateX(2px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    body {
      width: 170px;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      color: var(--text-color);
      background: white;
      opacity: 0;
      animation: instantAppear 0.15s cubic-bezier(0.19, 1, 0.22, 1) forwards;
      margin: 0;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      animation: quickScaleIn var(--animation-duration) cubic-bezier(0.19, 1, 0.22, 1) forwards;
    }

    .header-info {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .title {
      font-size: 23px;
      font-weight: 600;
      color: var(--primary-color);
      line-height: 1.2;
      opacity: 0;
      animation: quickFadeIn var(--animation-duration) cubic-bezier(0.19, 1, 0.22, 1) 0.05s forwards;
    }

    .powered-by {
      font-size: 10px;
      color: #888;
      margin-top: 6px;
      display: flex;
      align-items: center;
    }

    .sudokeys-logo {
      display: inline-block;
      margin-left: 4px;
      height: 16px;
      cursor: pointer;
    }

    .sudokeys-logo img {
      height: 16px;
      width: auto;
      animation: slideFromLeft 0.8s cubic-bezier(0.25, 1, 0.5, 1) 0.2s forwards;
      opacity: 0;
    }

    /* Sélecteur de mode Off / Debug / Assets */
    .mode-selector {
      display: none;
      padding: 6px 0;
      opacity: 0;
      animation: instantAppear 0.15s cubic-bezier(0.19, 1, 0.22, 1) 0.12s forwards;
    }

    .segment-control {
      display: flex;
      background: #efefef;
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
      width: 100%;
      box-sizing: border-box;
    }

    .segment {
      flex: 1;
      padding: 5px 0;
      border: none;
      background: transparent;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      color: #888;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      user-select: none;
    }

    .segment:hover:not(.active) {
      background: rgba(0, 0, 0, 0.06);
      color: #555;
    }

    .segment.active {
      background: var(--primary-color);
      color: white;
      font-weight: 600;
    }

    /* Messages d'information */
    .disabled-info {
      display: none;
      color: #666;
      font-style: italic;
      text-align: center;
      margin: 10px auto;
      font-size: 0.9em;
      animation: quickFadeIn 0.3s ease forwards;
      padding: 8px 12px;
      background-color: rgba(0, 0, 0, 0.05);
      border-radius: 6px;
      max-width: 180px;
      line-height: 1.4;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      border: 1px solid rgba(0,0,0,0.03);
    }

    .website-info {
      display: none;
      color: #555;
      text-align: center;
      margin: 15px auto;
      font-size: 0.9em;
      animation: quickFadeIn 0.3s ease forwards;
      padding: 10px 15px;
      background-color: rgba(255, 213, 79, 0.15);
      border-radius: 6px;
      max-width: 180px;
      line-height: 1.5;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      border: 1px solid rgba(234, 181, 22, 0.1);
    }

    .website-info .icon {
      margin-right: 5px;
      font-size: 0.9em;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-info">
      <span class="title">O<span style="color: #4bb04f;">Debug</span></span>
      <div class="powered-by">
        <span class="powered-by-text">Powered by</span>
        <a href="https://www.sudokeys.com" target="_blank" class="sudokeys-logo">
          <img src="/img/Sudokeys.webp?v=3" alt="Sudokeys" style="image-rendering: -webkit-optimize-contrast; image-rendering: crisp-edges;">
        </a>
      </div>
    </div>
  </div>

  <div class="disabled-info" style="display: none;">
    Odoo non détecté
  </div>

  <div class="website-info" style="display: none;">
    <span class="icon">ℹ️</span> Le mode debug ne peut être activé que sur les pages du backoffice.
  </div>

  <div class="mode-selector" id="mode-selector">
    <div class="segment-control">
      <button class="segment" id="btn-off">Off</button>
      <button class="segment" id="btn-debug">Debug</button>
      <button class="segment" id="btn-assets">Assets</button>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
